<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Menu RM. Uda Khairul - TarempaGO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- HEADER -->
  <header class="text-center py-6 bg-blue-600 text-white">
    <img src="logo.svg" alt="TarempaGO Logo" class="mx-auto h-16 mb-2" />
    <h1 class="text-2xl font-bold">🍛 Menu Rumah Makan Padang</h1>
    <p>Halo, <span id="namaUserSpan"></span>! Silakan pilih menu favoritmu.</p>
  </header>

  <!-- MENU -->
  <main class="flex-1 max-w-2xl mx-auto p-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- Contoh Menu Card -->
      <div class="border rounded p-4 bg-white shadow flex flex-col justify-between">
        <h3 class="font-bold mb-1">Rendang</h3>
        <p class="text-sm text-gray-600 mb-2">Rp 25.000</p>
        <button onclick="tambahKeKeranjang('Rendang', 25000)" class="bg-blue-600 text-white py-1 rounded hover:bg-blue-700">
          Tambah
        </button>
      </div>

      <div class="border rounded p-4 bg-white shadow flex flex-col justify-between">
        <h3 class="font-bold mb-1">Ayam Pop</h3>
        <p class="text-sm text-gray-600 mb-2">Rp 20.000</p>
        <button onclick="tambahKeKeranjang('Ayam Pop', 20000)" class="bg-blue-600 text-white py-1 rounded hover:bg-blue-700">
          Tambah
        </button>
      </div>

      <div class="border rounded p-4 bg-white shadow flex flex-col justify-between">
        <h3 class="font-bold mb-1">Teh Es</h3>
        <p class="text-sm text-gray-600 mb-2">Rp 5.000</p>
        <button onclick="tambahKeKeranjang('Teh Es', 5000)" class="bg-blue-600 text-white py-1 rounded hover:bg-blue-700">
          Tambah
        </button>
      </div>

    </div>

    <!-- KERANJANG -->
    <h3 class="text-lg font-semibold mt-8 mb-2">🛒 Keranjang Pesanan</h3>
    <div class="overflow-x-auto mb-4">
      <table class="min-w-full border text-left text-sm">
        <thead class="bg-gray-200">
          <tr>
            <th class="px-4 py-2">Menu</th>
            <th class="px-4 py-2">Qty</th>
            <th class="px-4 py-2">Harga</th>
            <th class="px-4 py-2">Aksi</th>
          </tr>
        </thead>
        <tbody id="keranjangBody" class="bg-white"></tbody>
      </table>
    </div>

    <!-- DROPDOWN TUJUAN -->
    <label for="tujuan" class="block font-semibold mb-1">Tujuan Pengantaran:</label>
    <select id="tujuan" onchange="hitungTotal()" class="w-full border rounded px-3 py-2 mb-4">
      <option value="0">-- Pilih Lokasi --</option>
      <option value="20000">Antang - Rp 20.000</option>
      <option value="15000">Batu Tambun - Rp 15.000</option>
      <option value="10000">Tanjung Lambai - Rp 10.000</option>
    </select>

    <!-- TOTAL -->
    <p class="font-semibold">Total Menu: <span id="totalMenuSpan">Rp 0</span></p>
    <p class="font-semibold">Ongkos TarempaGO: <span id="ongkirSpan">Rp 0</span></p>
    <p class="font-bold text-lg mt-1">Total Bayar: <span id="totalBayarSpan">Rp 0</span></p>

    <!-- CHECKOUT -->
    <button onclick="checkoutKeranjang()" class="mt-4 w-full bg-green-600 text-white py-3 rounded hover:bg-green-700">
      Checkout ➤ WhatsApp
    </button>

    <div class="mt-4 text-center">
      <a href="pilih-rumahmakan.html" class="text-blue-600 hover:underline">← Kembali Pilih Rumah Makan</a>
    </div>
  </main>

  <!-- SCRIPT -->
  <script>
    const namaUser = localStorage.getItem('nama_user') || 'Pelanggan';
    document.getElementById('namaUserSpan').textContent = namaUser;

    let keranjangKey = 'keranjang_padang'; // kunci khusus Padang
    let keranjang = JSON.parse(localStorage.getItem(keranjangKey)) || [];
    const keranjangBody = document.getElementById('keranjangBody');

    function tambahKeKeranjang(nama, harga) {
      const index = keranjang.findIndex(item => item.nama === nama);
      if (index !== -1) {
        keranjang[index].qty += 1;
      } else {
        keranjang.push({ nama: nama, qty: 1, harga: harga });
      }
      simpanKeranjang();
      renderKeranjang();
      hitungTotal();
    }

    function hapusDariKeranjang(nama) {
      keranjang = keranjang.filter(item => item.nama !== nama);
      simpanKeranjang();
      renderKeranjang();
      hitungTotal();
    }

    function simpanKeranjang() {
      localStorage.setItem(keranjangKey, JSON.stringify(keranjang));
    }

    function renderKeranjang() {
      keranjangBody.innerHTML = '';
      keranjang.forEach(item => {
        keranjangBody.innerHTML += `
          <tr>
            <td class="border px-4 py-2">${item.nama}</td>
            <td class="border px-4 py-2">${item.qty}</td>
            <td class="border px-4 py-2">Rp ${(item.harga * item.qty).toLocaleString()}</td>
            <td class="border px-4 py-2">
              <button class="text-red-600 hover:underline" onclick="hapusDariKeranjang('${item.nama}')">Hapus</button>
            </td>
          </tr>
        `;
      });
    }

    function hitungTotalMenu() {
      let total = 0;
      keranjang.forEach(item => {
        total += item.qty * item.harga;
      });
      return total;
    }

    function hitungTotal() {
      const ongkir = parseInt(document.getElementById('tujuan').value) || 0;
      const totalMenu = hitungTotalMenu();
      const totalBayar = totalMenu + ongkir;

      document.getElementById('totalMenuSpan').textContent = 'Rp ' + totalMenu.toLocaleString();
      document.getElementById('ongkirSpan').textContent = 'Rp ' + ongkir.toLocaleString();
      document.getElementById('totalBayarSpan').textContent = 'Rp ' + totalBayar.toLocaleString();
    }

    function checkoutKeranjang() {
      if (keranjang.length === 0) {
        alert("Keranjang masih kosong!");
        return;
      }

      const tujuan = document.getElementById('tujuan');
      const ongkir = parseInt(tujuan.value) || 0;
      const lokasi = tujuan.options[tujuan.selectedIndex].text.split(' - ')[0];

      if (lokasi === "-- Pilih Lokasi --") {
        alert("Pilih lokasi pengantaran dulu!");
        return;
      }

      const totalMenu = hitungTotalMenu();
      const totalBayar = totalMenu + ongkir;

      let message = `🍛 *PESANAN Rumah Makan Padang*\n\n`;
      message += `👤 *Nama:* ${namaUser}\n`;
      message += `📍 *Tujuan:* ${lokasi}\n`;
      message += `📝 *Pesanan:*\n`;
      keranjang.forEach(item => {
        message += `- ${item.nama} x${item.qty}\n`;
      });
      message += `\n💰 *Total Menu:* Rp ${totalMenu.toLocaleString()}\n`;
      message += `🚕 *Ongkos TarempaGO:* Rp ${ongkir.toLocaleString()}\n`;
      message += `💵 *Total Bayar:* Rp ${totalBayar.toLocaleString()}\n`;
      message += `\n✨ Terima kasih sudah pesan via TarempaGO!`;

      const encodedMessage = encodeURIComponent(message);
      const waURL = `https://wa.me/6288271127189?text=${encodedMessage}`;
      window.open(waURL, '_blank');

      localStorage.removeItem(keranjangKey);
    }

    renderKeranjang();
    hitungTotal();
  </script>

</body>
</html>
