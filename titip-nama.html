<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Titip Makan - Input Nama</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded shadow max-w-md w-full">
    <h1 class="text-2xl font-bold mb-4 text-center">🍱 Titip Makan</h1>
    <p class="mb-6 text-center">Silakan masukkan nama Anda sebelum lanjut memilih warung.</p>

    <div class="mb-4">
      <label for="namaUser" class="block mb-1 font-medium">Nama Lengkap:</label>
      <input type="text" id="namaUser" class="w-full border rounded px-3 py-2" placeholder="Nama Anda..." required>
    </div>

    <button onclick="lanjutPilihToko()"
      class="w-full bg-blue-600 text-white py-3 rounded hover:bg-blue-700">
      Lanjut Pilih Warung ➤
    </button>
  </div>

  <script>
    function lanjutPilihToko() {
      const nama = document.getElementById('namaUser').value.trim();

      if (!nama) {
        alert('Nama tidak boleh kosong!');
        return;
      }

      // Simpan ke localStorage
      localStorage.setItem('nama_user', nama);

      // Pindah ke halaman pilih toko
      window.location.href = 'pilih-rumahmakan.html';
    }
  </script>

</body>
</html>
