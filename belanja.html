<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titip Belanja - TarempaGO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.svg" alt="TarempaGO Logo" class="logo">
        <h1>🛒 Titip Belanja</h1>
        <p>Belanja kebutuhan sehari-hari dengan mudah</p>
    </header>

    <main>
        <div class="form-container">
            <form id="belanjaForm">
                <div class="form-group">
                    <label for="nama">Nama Pelanggan:</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda" required>
                </div>
 
                <div class="form-group">
                    <label for="lokasi_belanja">Lokasi Belanja:</label>
                    <input type="text" id="lokasi_belanja" name="lokasi_belanja" placeholder="Contoh: Pasar Tarempa, Toko ABC" required>
                </div>

                <div class="form-group">
                    <label for="daftar_belanja">Daftar Barang Belanja:</label>
                    <textarea id="daftar_belanja" name="daftar_belanja" placeholder="Contoh:&#10;- Beras 5kg&#10;- Gula pasir 1kg&#10;- Minyak goreng 2L&#10;- Telur 1kg" rows="6" required></textarea>
                </div>

                <div class="form-group">
                    <label for="alamat_kirim">Alamat Pengiriman:</label>
                    <input type="text" id="alamat_kirim" name="alamat_kirim" placeholder="Alamat lengkap untuk pengiriman barang" required>
                </div>

                <div class="form-group">
                    <label for="budget">Estimasi Budget:</label>
                    <input type="text" id="budget" name="budget" placeholder="Contoh: Rp 200.000" required>
                </div>

                <div class="form-group">
                    <label for="catatan">Catatan Tambahan:</label>
                    <textarea id="catatan" name="catatan" placeholder="Catatan khusus, merek tertentu, dll (opsional)" rows="3"></textarea>
                </div>

                <fieldset class="payment-method">
                    <legend>Metode Pembayaran:</legend>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="bayar" value="COD" required>
                            <span>COD (Bayar di Tempat)</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="bayar" value="Transfer" required>
                            <span>Transfer Bank</span>
                        </label>
                    </div>
                </fieldset>

                <button type="submit" class="submit-btn">Kirim Pesan ke WhatsApp</button>
            </form>

            <div class="back-link">
                <a href="index.html">← Kembali ke Menu Utama</a>
            </div>
        </div>
    </main>

    <script src="wa.js"></script>
</body>
</html>
