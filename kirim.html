<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Barang - TarempaGO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.svg" alt="TarempaGO Logo" class="logo">
        <h1>📦 Kirim Barang</h1>
        <p>Pengiriman barang cepat dan aman antar lokasi</p>
    </header>

    <main>
        <div class="form-container">
            <form id="kirimForm">
                <div class="form-group">
                    <label for="nama">Nama Pengirim:</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda" required>
                </div>

                <div class="form-group">
                    <label for="alamat_penjemputan">Alamat Penjemputan Barang:</label>
                    <input type="text" id="alamat_penjemputan" name="alamat_penjemputan" placeholder="Alamat lengkap penjemputan barang" required>
                </div>

                <div class="form-group">
                    <label for="alamat_tujuan">Alamat Tujuan Pengiriman:</label>
                    <input type="text" id="alamat_tujuan" name="alamat_tujuan" placeholder="Alamat lengkap tujuan pengiriman" required>
                </div>

                <div class="form-group">
                    <label for="nama_penerima">Nama Penerima:</label>
                    <input type="text" id="nama_penerima" name="nama_penerima" placeholder="Nama lengkap penerima barang" required>
                </div>

                <div class="form-group">
                    <label for="hp_penerima">No. HP Penerima:</label>
                    <input type="tel" id="hp_penerima" name="hp_penerima" placeholder="Nomor HP penerima" required>
                </div>

                <div class="form-group">
                    <label for="deskripsi_barang">Deskripsi Barang:</label>
                    <textarea id="deskripsi_barang" name="deskripsi_barang" placeholder="Contoh:&#10;- Jenis barang: Dokumen&#10;- Ukuran: A4&#10;- Berat: 0.5kg&#10;- Nilai barang: Rp 50.000" rows="5" required></textarea>
                </div>

                <div class="form-group">
                    <label for="waktu_kirim">Waktu Pengiriman Diinginkan:</label>
                    <select id="waktu_kirim" name="waktu_kirim" required>
                        <option value="">Pilih waktu pengiriman</option>
                        <option value="Segera">Segera (dalam 1-2 jam)</option>
                        <option value="Hari ini">Hari ini</option>
                        <option value="Besok">Besok</option>
                        <option value="Jadwal khusus">Jadwal khusus (tulis di catatan)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="catatan">Catatan Tambahan:</label>
                    <textarea id="catatan" name="catatan" placeholder="Instruksi khusus, jadwal tertentu, dll (opsional)" rows="3"></textarea>
                </div>

                <fieldset class="payment-method">
                    <legend>Metode Pembayaran:</legend>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="bayar" value="COD" required>
                            <span>COD (Bayar di Tempat)</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="bayar" value="Transfer" required>
                            <span>Transfer Bank</span>
                        </label>
                    </div>
                </fieldset>

                <button type="submit" class="submit-btn">Kirim Pesan ke WhatsApp</button>
            </form>

            <div class="back-link">
                <a href="index.html">← Kembali ke Menu Utama</a>
            </div>
        </div>
    </main>

    <script src="wa.js"></script>
</body>
</html>
